<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess</title>
    <link rel="stylesheet" href="main_chess.css">
</head>
<body>

<h1>♔ Chess Arena ♔</h1>
<h3 id="room-id"></h3>
<div class="game-container">

    <div class="chess-board">

        <div class="row">
            <button id="0-0" class="square light">♖</button>
            <button id="0-1" class="square dark">♘</button>
            <button id="0-2" class="square light">♗</button>
            <button id="0-3" class="square dark">♕</button>
            <button id="0-4" class="square light">♔</button>
            <button id="0-5" class="square dark">♗</button>
            <button id="0-6" class="square light">♘</button>
            <button id="0-7" class="square dark">♖</button>
        </div>

        <div class="row">
            <button id="1-0" class="square dark">♙</button>
            <button id="1-1" class="square light">♙</button>
            <button id="1-2" class="square dark">♙</button>
            <button id="1-3" class="square light">♙</button>
            <button id="1-4" class="square dark">♙</button>
            <button id="1-5" class="square light">♙</button>
            <button id="1-6" class="square dark">♙</button>
            <button id="1-7" class="square light">♙</button>
        </div>

        <div class="row">
            <button id="2-0" class="square light"></button>
            <button id="2-1" class="square dark"></button>
            <button id="2-2" class="square light"></button>
            <button id="2-3" class="square dark"></button>
            <button id="2-4" class="square light"></button>
            <button id="2-5" class="square dark"></button>
            <button id="2-6" class="square light"></button>
            <button id="2-7" class="square dark"></button>
        </div>

        <div class="row">
            <button id="3-0" class="square dark"></button>
            <button id="3-1" class="square light"></button>
            <button id="3-2" class="square dark"></button>
            <button id="3-3" class="square light"></button>
            <button id="3-4" class="square dark"></button>
            <button id="3-5" class="square light"></button>
            <button id="3-6" class="square dark"></button>
            <button id="3-7" class="square light"></button>
        </div>

        <div class="row">
            <button id="4-0" class="square light"></button>
            <button id="4-1" class="square dark"></button>
            <button id="4-2" class="square light"></button>
            <button id="4-3" class="square dark"></button>
            <button id="4-4" class="square light"></button>
            <button id="4-5" class="square dark"></button>
            <button id="4-6" class="square light"></button>
            <button id="4-7" class="square dark"></button>
        </div>

        <div class="row">
            <button id="5-0" class="square dark"></button>
            <button id="5-1" class="square light"></button>
            <button id="5-2" class="square dark"></button>
            <button id="5-3" class="square light"></button>
            <button id="5-4" class="square dark"></button>
            <button id="5-5" class="square light"></button>
            <button id="5-6" class="square dark"></button>
            <button id="5-7" class="square light"></button>
        </div>

        <div class="row">
            <button id="6-0" class="square light">♟</button>
            <button id="6-1" class="square dark">♟</button>
            <button id="6-2" class="square light">♟</button>
            <button id="6-3" class="square dark">♟</button>
            <button id="6-4" class="square light">♟</button>
            <button id="6-5" class="square dark">♟</button>
            <button id="6-6" class="square light">♟</button>
            <button id="6-7" class="square dark">♟</button>
        </div>

        <div class="row">
            <button id="7-0" class="square dark">♜</button>
            <button id="7-1" class="square light">♞</button>
            <button id="7-2" class="square dark">♝</button>
            <button id="7-3" class="square light">♛</button>
            <button id="7-4" class="square dark">♚</button>
            <button id="7-5" class="square light">♝</button>
            <button id="7-6" class="square dark">♞</button>
            <button id="7-7" class="square light">♜</button>
        </div>

    </div>

    <div class="side-panel">

        <h2>Game Controls</h2>

        <button class="control-btn" id="history-btn">
            Move History
        </button>
        <button class="control-btn" id="flip-btn">
            Flip Board
        </button>
        <button class="control-btn" id="draw-btn">
            Offer Draw
        </button>

        <button class="control-btn resign" id="resign-btn">
            Resign
        </button>

        <div class="history-box">
            <h3>Moves</h3>
            <div id="move-history">
                No moves yet.
            </div>
        </div>

    </div>

</div>

<script src="main_chess.js"></script>

</body>
</html>
